[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uz-clinic-appointment-system"
version = "1.0.0"
description = "University of Zimbabwe Programming Languages clinic appointment system mini project"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Super Washington Banga" },
    { name = "Anesu Prosper Matanhire" },
]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
